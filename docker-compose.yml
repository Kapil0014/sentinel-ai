# Sentinel AI: development stack (Week 1 foundation).
#
#   cp .env.example .env
#   docker compose up --build --wait
#
# Networks
#   app_net      data plane: postgres, redis, backend, frontend
#   browser_net  untrusted-content plane: browser-worker, demo-site (+ backend to talk to the worker)
# The browser-worker is NOT on app_net, so it cannot reach PostgreSQL or Redis at the network level.
#
# Host ports are bound to 127.0.0.1 only: nothing here is exposed to your LAN.

name: sentinel-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Override the "run on my machine" values from .env with in-network addresses.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      BROWSER_WORKER_URL: http://browser-worker:8081
      ARTIFACTS_DIR: /artifacts
    # Development: apply migrations, then serve with auto-reload. Production runs migrations
    # as a separate one-shot step (Week 6).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - artifacts:/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [app_net, browser_net]

  browser-worker:
    build: ./browser-worker
    environment:
      PORT: "8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CHROMIUM_SANDBOX: ${CHROMIUM_SANDBOX:-false}
    init: true # reap zombie Chromium processes
    shm_size: "1gb" # Chromium needs more than Docker's 64 MB default /dev/shm
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [browser_net]

  demo-site:
    build: ./demo-site
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [browser_net]

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # keep container deps out of the host checkout
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [app_net]

  # Reserved for the post-MVP RAG phase. Not started by default:
  #   docker compose --profile rag up -d qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: [rag]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks: [app_net]

networks:
  app_net:
  browser_net:

volumes:
  pgdata:
  artifacts:
  frontend_node_modules:
  qdrant_data:
